<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy and Accessibility Policy — West Sacramento Inclusive Sailing Foundation</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/logo-stack-light.svg" alt="West Sacramento Inclusive Sailing Foundation" class="brand-logo">
    </a>
  </div>
</nav>

<section class="on-white" style="padding-top:64px;">
  <div class="container" style="max-width:820px;">
    <span class="eyebrow">Legal</span>
    <h2 id="page-headline"></h2>

    <div class="legal-section" id="privacy-policy">
      <h3 id="privacy-headline"></h3>
      <p id="privacy-intro"></p>
      <div id="privacy-sections"></div>
      <p id="privacy-closing" style="margin-top:1.4em; font-size:0.9rem; color:rgba(22,35,43,0.6);"></p>
    </div>

    <div class="legal-section" id="disclaimer">
      <h3 id="disclaimer-headline"></h3>
      <div id="disclaimer-body"></div>
    </div>

    <div class="legal-section" id="accessibility-statement">
      <h3 id="accessibility-headline"></h3>
      <div id="accessibility-body"></div>
    </div>

    <p style="margin-top:48px;"><a href="index.html">&larr; Back to home</a></p>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="assets/logo-stack-light.svg" alt="" aria-hidden="true" class="footer-logo">
        <div id="footer-org-name" class="footer-org-name"></div>
        <div class="tagline" id="footer-tagline"></div>
        <div id="footer-address" class="footer-line"></div>
        <div id="footer-phone" class="footer-line"></div>
        <div id="footer-email" class="footer-line"></div>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <ul id="footer-nav-links"></ul>
      </nav>
    </div>
    <div class="footer-legal">
      <p id="footer-legal-statement"></p>
      <p class="ein-line" id="footer-ein"></p>
      <p class="footer-social" id="footer-instagram"></p>
    </div>
    <div class="footer-bottom">
      <div id="footer-copyright"></div>
      <div class="footer-legal-links" id="footer-legal-links"></div>
    </div>
  </div>
</footer>

<script>
  fetch('content.json').then(r => r.json()).then(content => {
    const legal = content.legal;

    document.getElementById('page-headline').textContent = legal.page_headline;

    // Privacy policy
    document.getElementById('privacy-headline').textContent = legal.privacy_policy.headline;
    document.getElementById('privacy-intro').textContent = legal.privacy_policy.intro;
    document.getElementById('privacy-sections').innerHTML = legal.privacy_policy.sections.map(s => `
      <div class="legal-subsection">
        <h4>${s.heading}</h4>
        ${s.body.split('\n\n').map(p => `<p>${p}</p>`).join('')}
      </div>
    `).join('');
    document.getElementById('privacy-closing').textContent = legal.privacy_policy.closing;

    // Disclaimer
    document.getElementById('disclaimer-headline').textContent = legal.disclaimer.headline;
    document.getElementById('disclaimer-body').innerHTML =
      legal.disclaimer.body.split('\n\n').map(p => `<p>${p}</p>`).join('');

    // Accessibility
    document.getElementById('accessibility-headline').textContent = legal.accessibility_statement.headline;
    document.getElementById('accessibility-body').innerHTML =
      legal.accessibility_statement.body.split('\n\n').map(p => `<p>${p}</p>`).join('');

    // Footer (mirrors index.html)
    const footer = content.footer;
    document.getElementById('footer-org-name').textContent = footer.org_name;
    document.getElementById('footer-tagline').textContent = footer.tagline;
    document.getElementById('footer-address').textContent = footer.address;
    document.getElementById('footer-phone').textContent = footer.phone ? `Phone: ${footer.phone}` : 'Phone: TBD';
    document.getElementById('footer-email').innerHTML = `<a href="mailto:${footer.email}">${footer.email}</a>`;
    document.getElementById('footer-nav-links').innerHTML =
      footer.nav.map(n => `<li><a href="${n.href}">${n.label}</a></li>`).join('');
    document.getElementById('footer-legal-statement').textContent = legal_statement_fallback(footer);
    if (footer.instagram_handle) {
      document.getElementById('footer-instagram').innerHTML = `<a href="${footer.instagram_url}" target="_blank" rel="noopener" aria-label="Instagram: ${footer.instagram_handle}"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2.2c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.38C1.35 2.68.94 3.35.63 4.14.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.38 2.13.67.66 1.34 1.07 2.13 1.38.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.31 1.46-.72 2.13-1.38.66-.67 1.07-1.34 1.38-2.13.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91-.31-.79-.72-1.46-1.38-2.13C21.32 1.35 20.65.94 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0z"/><path d="M12 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4z"/><circle cx="18.41" cy="5.59" r="1.44"/></svg></a>`;
    }
    document.getElementById('footer-ein').textContent = 'EIN: ' + footer.ein;
    document.getElementById('footer-copyright').textContent = footer.copyright;
    document.getElementById('footer-legal-links').innerHTML = footer.legal_links.map(l =>
      l.action ? `<a href="#" data-action="${l.action}">${l.label}</a>` : `<a href="${l.href}">${l.label}</a>`
    ).join('');

    function legal_statement_fallback(f) { return f.legal_statement; }
  });
</script>
<script src="cookie-consent.js?v=6"></script>
</body>
</html>
