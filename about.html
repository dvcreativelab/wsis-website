<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — West Sacramento Inclusive Sailing Foundation</title>
<meta name="description" content="The story, mission, and people behind West Sacramento Inclusive Sailing Foundation.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body class="bg-white">

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/logo-stack-light.svg" alt="West Sacramento Inclusive Sailing Foundation" class="brand-logo">
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    <ul class="nav-links" id="navLinks"></ul>
  </div>
</nav>

<header class="hero hero-page" id="about-hero">
  <div class="container">
    <div class="section-head" style="margin-bottom:0;">
      <h2 id="about-headline"></h2>
      <div id="about-intro"></div>
    </div>
  </div>
</header>

<section class="on-white">
  <div class="container">
    <div class="block" style="border-top:none;">
      <div class="side"></div>
      <div class="main">
        <h3 id="about-mission-headline"></h3>
        <div id="about-mission-body"></div>
      </div>
    </div>

    <div class="block" style="border-top:none; padding-top:0;">
      <div class="side"></div>
      <div class="main">
        <h3 id="about-founders-headline"></h3>
        <div id="about-founders-body"></div>
      </div>
    </div>
  </div>
</section>

<section class="section-dark">
  <div class="container">
    <h2 id="about-board-headline"></h2>
    <p id="about-board-intro"></p>
    <div class="board-grid" id="about-board-grid"></div>
  </div>
</section>

<section class="on-white">
  <div class="container">
    <div class="section-head" style="margin-bottom:0;">
      <h2 id="about-story-headline"></h2>
    </div>
    <div class="story" id="about-story-body"></div>
    <div class="photo-framed-wrap">
      <img id="about-story-photo" src="" alt="Jim Thweatt" class="photo-framed" style="display:none;">
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="assets/logo-stack-light.svg" alt="" aria-hidden="true" class="footer-logo">
        <div id="footer-org-name" class="footer-org-name"></div>
        <div class="tagline" id="footer-tagline"></div>
        <div id="footer-address" class="footer-line"></div>
        <div id="footer-phone" class="footer-line"></div>
        <div id="footer-email" class="footer-line"></div>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <ul id="footer-nav-links"></ul>
      </nav>
    </div>
    <div class="footer-legal">
      <p id="footer-legal-statement"></p>
      <p class="ein-line" id="footer-ein"></p>
      <p class="footer-social" id="footer-instagram"></p>
    </div>
    <div class="footer-bottom">
      <div id="footer-copyright"></div>
      <div class="footer-legal-links" id="footer-legal-links"></div>
    </div>
  </div>
</footer>

<script src="script.js?v=6"></script>
<script src="cookie-consent.js?v=6"></script>
</body>
</html>
