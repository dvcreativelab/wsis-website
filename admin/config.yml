backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - file: "content.json"
        label: "Site Content"
        name: "site_content"
        fields:
          - label: "Organization"
            name: "site"
            widget: "object"
            fields:
              - { label: "Organization Name", name: "org_name", widget: "string" }
              - { label: "Contact Email", name: "email", widget: "string" }
              - { label: "Donate Link", name: "donate_url", widget: "string", hint: "Your Stripe checkout link (or any hosted donate/payment link). This one field powers every Donate button sitewide." }
              - label: "Navigation Menu"
                name: "nav"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }

          - label: "Home — Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subheadline", name: "subhead", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - label: "Primary Button"
                name: "cta_primary"
                widget: "object"
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }
              - label: "Secondary Button"
                name: "cta_secondary"
                widget: "object"
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Link (leave blank to use the Donate Link above)", name: "href", widget: "string", required: false }
              - { label: "Background Video (Google Drive File ID, optional)", name: "video_drive_id", widget: "string", required: false, hint: "If set, this can be used in place of the photo background. Leave blank to use the photo." }

          - label: "Home — Feature Blocks"
            name: "home_blocks"
            widget: "list"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - label: "Button (optional)"
                name: "cta"
                widget: "object"
                required: false
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }
              - label: "Primary Button (optional)"
                name: "cta_primary"
                widget: "object"
                required: false
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Link (leave blank to use the Donate Link)", name: "href", widget: "string", required: false }
              - label: "Secondary Button (optional)"
                name: "cta_secondary"
                widget: "object"
                required: false
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }

          - label: "Home — Closing Section"
            name: "home_closing"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - label: "Primary Button"
                name: "cta_primary"
                widget: "object"
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Link (leave blank to use the Donate Link)", name: "href", widget: "string", required: false }
              - label: "Secondary Button"
                name: "cta_secondary"
                widget: "object"
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }

          - label: "Sail Page"
            name: "sail"
            widget: "object"
            fields:
              - { label: "Hero Photo", name: "hero_image", widget: "image", required: false }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subheadline", name: "subhead", widget: "string" }
              - { label: "Intro Text", name: "intro", widget: "text" }
              - { label: "Featured Photo (below hero)", name: "featured_photo", widget: "image", required: false }
              - label: "Adaptive Sailing Block"
                name: "adaptive"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Getting Started Headline", name: "getting_started_headline", widget: "string" }
                  - { label: "Getting Started Body", name: "getting_started_body", widget: "text" }
                  - { label: "Requirements", name: "requirements", widget: "list" }
                  - { label: "Closing Text", name: "closing", widget: "text" }
                  - label: "Button"
                    name: "cta"
                    widget: "object"
                    fields:
                      - { label: "Button Text", name: "text", widget: "string" }
                      - { label: "Link", name: "href", widget: "string" }
                  - { label: "Video (Google Drive File ID, optional)", name: "video_drive_id", widget: "string", required: false }
              - label: "Access Sailing Block"
                name: "access"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - label: "Button"
                    name: "cta"
                    widget: "object"
                    fields:
                      - { label: "Button Text", name: "text", widget: "string" }
                      - { label: "Link", name: "href", widget: "string" }
              - label: "Membership Block"
                name: "membership"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
              - label: "Closing Block"
                name: "closing"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }

          - label: "Videos"
            name: "videos"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Intro Line", name: "intro", widget: "string" }
              - label: "Video List"
                name: "list"
                widget: "list"
                fields:
                  - { label: "Title / Caption", name: "title", widget: "string" }
                  - { label: "Google Drive File ID", name: "drive_id", widget: "string", hint: "The long ID from the Drive share link, e.g. the part between /d/ and /view in https://drive.google.com/file/d/THIS_PART/view" }

          - label: "FAQ Page"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer (HTML links allowed, e.g. <a href=\"...\">text</a>)", name: "answer", widget: "text" }

          - label: "About Page"
            name: "about"
            widget: "object"
            fields:
              - { label: "Hero Photo", name: "hero_image", widget: "image", required: false }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Intro Text", name: "intro", widget: "text" }
              - label: "Mission"
                name: "mission"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
              - label: "Founders"
                name: "founders"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
              - label: "Board of Directors"
                name: "board"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Intro", name: "intro", widget: "text" }
                  - label: "Members"
                    name: "members"
                    widget: "list"
                    fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - { label: "Title", name: "title", widget: "string" }
              - label: "Jim's Story"
                name: "jims_story"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Photo (optional)", name: "photo", widget: "image", required: false }

          - label: "Donate Page"
            name: "donate"
            widget: "object"
            fields:
              - { label: "Hero Photo", name: "hero_image", widget: "image", required: false }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Intro Text", name: "intro", widget: "text" }
              - label: "Intro Button"
                name: "intro_cta"
                widget: "object"
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Link (leave blank to use the Donate Link)", name: "href", widget: "string", required: false }
              - label: "Closing"
                name: "closing"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Lines", name: "lines", widget: "list" }
                  - { label: "Body", name: "body", widget: "text" }
                  - label: "Primary Button"
                    name: "cta_primary"
                    widget: "object"
                    fields:
                      - { label: "Button Text", name: "text", widget: "string" }
                      - { label: "Link (leave blank to use the Donate Link)", name: "href", widget: "string", required: false }
                  - label: "Secondary Button"
                    name: "cta_secondary"
                    widget: "object"
                    fields:
                      - { label: "Button Text", name: "text", widget: "string" }
                      - { label: "Link", name: "href", widget: "string" }

          - label: "Sponsor Page"
            name: "sponsor"
            widget: "object"
            fields:
              - { label: "Hero Photo", name: "hero_image", widget: "image", required: false }
              - label: "Corporate Sponsorship"
                name: "corporate"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Intro", name: "intro", widget: "text" }
                  - label: "Sponsorship Tiers"
                    name: "tiers"
                    widget: "list"
                    fields:
                      - { label: "Amount", name: "amount", widget: "string" }
                      - { label: "Tier Name", name: "name", widget: "string" }
                      - { label: "Description", name: "body", widget: "text" }
                  - label: "Button"
                    name: "cta"
                    widget: "object"
                    fields:
                      - { label: "Button Text", name: "text", widget: "string" }
                      - { label: "Link", name: "href", widget: "string" }
                  - { label: "Custom Sponsorship Note (before link)", name: "custom_note", widget: "string" }
                  - label: "Custom Sponsorship Link"
                    name: "custom_cta"
                    widget: "object"
                    fields:
                      - { label: "Link Text", name: "text", widget: "string" }
                      - { label: "Link", name: "href", widget: "string" }
                  - { label: "Custom Sponsorship Note (after link)", name: "custom_note_after", widget: "string" }
              - label: "Our Sponsors"
                name: "sponsors"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - label: "Sponsor List"
                    name: "list"
                    widget: "list"
                    fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - { label: "Logo Image", name: "logo", widget: "image", required: false, hint: "Upload a logo image. Leave blank to show the sponsor's name as text instead." }

          - label: "Contact Page"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Hero Photo", name: "hero_image", widget: "image", required: false }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - { label: "Form Headline", name: "form_headline", widget: "string" }
              - { label: "\"I'm interested in\" Options", name: "interest_options", widget: "list" }
              - { label: "Submit Button Label", name: "submit_label", widget: "string" }
              - { label: "Video (Google Drive File ID, optional)", name: "video_drive_id", widget: "string", required: false, hint: "Shows next to the contact form. Leave blank to leave that space empty." }

          - label: "Legal & Cookie Notice"
            name: "legal"
            widget: "object"
            fields:
              - label: "Cookie Banner"
                name: "cookie_banner"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Accept Button Label", name: "accept_label", widget: "string" }
                  - { label: "Manage Preferences Button Label", name: "manage_label", widget: "string" }
                  - { label: "Opt-Out Link Label", name: "optout_label", widget: "string" }
              - label: "Consent Preferences Modal"
                name: "consent_modal"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Checkbox Label", name: "checkbox_label", widget: "string" }
                  - { label: "Cancel Button Label", name: "cancel_label", widget: "string" }
                  - { label: "Save Button Label", name: "save_label", widget: "string" }
              - { label: "Legal Page Headline", name: "page_headline", widget: "string" }
              - label: "Privacy Policy"
                name: "privacy_policy"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Intro", name: "intro", widget: "text" }
                  - label: "Sections"
                    name: "sections"
                    widget: "list"
                    fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Body", name: "body", widget: "text" }
                  - { label: "Closing Note", name: "closing", widget: "text" }
              - label: "Disclaimer"
                name: "disclaimer"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
              - label: "Accessibility Statement"
                name: "accessibility_statement"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Organization Name", name: "org_name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string", required: false, hint: "Leave blank to show 'TBD'" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "EIN", name: "ein", widget: "string", hint: "Format: XX-XXXXXXX" }
              - label: "Footer Navigation"
                name: "nav"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }
              - { label: "501(c)(3) Statement", name: "legal_statement", widget: "string" }
              - { label: "Instagram Handle", name: "instagram_handle", widget: "string", required: false, hint: "e.g. @westsacinclusivesailing. Leave blank to hide the icon from the footer." }
              - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
              - { label: "Copyright Line", name: "copyright", widget: "string" }
              - label: "Legal Links"
                name: "legal_links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link (leave as # if using the action below)", name: "href", widget: "string" }
                  - { label: "Special Action (leave blank unless this is the cookie preferences link)", name: "action", widget: "string", required: false }
