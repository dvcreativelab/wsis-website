<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — West Sacramento Inclusive Sailing Foundation</title>
<meta name="description" content="Support West Sacramento Inclusive Sailing Foundation through individual giving, corporate partnership, or a major gift.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/logo-stack-light.svg" alt="West Sacramento Inclusive Sailing Foundation" class="brand-logo">
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    <ul class="nav-links" id="navLinks"></ul>
  </div>
</nav>

<section id="support" style="padding-top:64px;">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Why It Matters</span>
      <h2 id="support-headline"></h2>
      <div id="support-intro"></div>
      <div class="cta-row"><a class="btn btn-primary" id="support-intro-cta" href="#"></a></div>
    </div>

    <div class="block">
      <div class="side">Your Gift</div>
      <div class="main">
        <h3 id="support-gift-headline"></h3>
        <p id="support-gift-intro"></p>
        <ul class="impact-list" id="support-gift-items"></ul>
        <p id="support-gift-closing"></p>
        <div class="cta-row"><a class="btn btn-primary" id="support-gift-cta" href="#"></a></div>
      </div>
    </div>

    <div class="block">
      <div class="side">Partnership</div>
      <div class="main">
        <h3 id="support-partner-headline"></h3>
        <div id="support-partner-body"></div>
        <div class="cta-row"><a class="btn btn-primary" id="support-partner-cta" href="#"></a></div>
      </div>
    </div>
  </div>
</section>

<section class="on-white">
  <div class="container">
    <div class="photo-banner-wrap">
      <img src="assets/sunset-sail.jpg" alt="A sailboat silhouetted against a sunset on the water" class="photo-banner">
      <p class="photo-caption">Every gift helps someone find this feeling.</p>
    </div>
  </div>
</section>

<section class="section-dark">
  <div class="container">
    <h2 id="support-closing-headline"></h2>
    <div id="support-closing-lines" style="font-family:var(--font-display); text-transform:uppercase; font-size:clamp(1.2rem,2.4vw,1.6rem); line-height:1.5;"></div>
    <p id="support-closing-body" style="margin-top:0.8em;"></p>
    <div class="cta-row">
      <a class="btn btn-primary" id="support-closing-cta-primary" href="#"></a>
      <a class="btn btn-outline" id="support-closing-cta-secondary" href="#"></a>
    </div>
  </div>
</section>

<section class="on-white">
  <div class="container" style="text-align:center;">
    <span class="eyebrow">Gratitude</span>
    <h3 id="support-sponsors-headline" style="text-transform:uppercase; font-family:var(--font-display);"></h3>
    <div class="sponsor-grid" id="support-sponsors-grid"></div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="assets/logo-stack-light.svg" alt="" aria-hidden="true" class="footer-logo">
        <div id="footer-org-name" class="footer-org-name"></div>
        <div class="tagline" id="footer-tagline"></div>
        <div id="footer-address" class="footer-line"></div>
        <div id="footer-phone" class="footer-line"></div>
        <div id="footer-email" class="footer-line"></div>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <ul id="footer-nav-links"></ul>
      </nav>
    </div>
    <div class="footer-legal">
      <p id="footer-legal-statement"></p>
      <p class="ein-line" id="footer-ein"></p>
      <p class="footer-social" id="footer-instagram"></p>
    </div>
    <div class="footer-bottom">
      <div id="footer-copyright"></div>
      <div class="footer-legal-links" id="footer-legal-links"></div>
    </div>
  </div>
</footer>

<script src="script.js?v=2"></script>
<script src="cookie-consent.js?v=2"></script>
</body>
</html>
