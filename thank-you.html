<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — West Sacramento Inclusive Sailing Foundation</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/logo-stack-light.svg" alt="West Sacramento Inclusive Sailing Foundation" class="brand-logo">
    </a>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <span class="eyebrow" style="color:var(--brass);">Message Sent</span>
    <h1>Thanks for Reaching Out.</h1>
    <p class="subhead">We'll be in touch soon.</p>
    <div class="body">
      <p>Your message has been received. Whether you're looking to get on the water, volunteer, or support the mission, someone from West Sacramento Inclusive Sailing Foundation will follow up with you shortly.</p>
    </div>
    <div class="cta-row">
      <a class="btn btn-primary" href="index.html">Back to Home</a>
      <a class="btn btn-outline" href="sail.html">Explore Sailing</a>
    </div>
  </div>
</header>

<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="assets/logo-stack-light.svg" alt="" aria-hidden="true" class="footer-logo">
        <div id="footer-org-name" class="footer-org-name"></div>
        <div class="tagline" id="footer-tagline"></div>
        <div id="footer-address" class="footer-line"></div>
        <div id="footer-phone" class="footer-line"></div>
        <div id="footer-email" class="footer-line"></div>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <ul id="footer-nav-links"></ul>
      </nav>
    </div>
    <div class="footer-legal">
      <p id="footer-legal-statement"></p>
      <p class="ein-line" id="footer-ein"></p>
      <p class="footer-social" id="footer-instagram"></p>
    </div>
    <div class="footer-bottom">
      <div id="footer-copyright"></div>
      <div class="footer-legal-links" id="footer-legal-links"></div>
    </div>
  </div>
</footer>

<script>
  fetch('content.json').then(r => r.json()).then(content => {
    const footer = content.footer;
    document.getElementById('footer-org-name').textContent = footer.org_name;
    document.getElementById('footer-tagline').textContent = footer.tagline;
    document.getElementById('footer-address').textContent = footer.address;
    document.getElementById('footer-phone').textContent = footer.phone ? `Phone: ${footer.phone}` : 'Phone: TBD';
    document.getElementById('footer-email').innerHTML = `<a href="mailto:${footer.email}">${footer.email}</a>`;
    document.getElementById('footer-nav-links').innerHTML =
      footer.nav.map(n => `<li><a href="${n.href}">${n.label}</a></li>`).join('');
    document.getElementById('footer-legal-statement').textContent = footer.legal_statement;
    if (footer.instagram_handle) {
      document.getElementById('footer-instagram').innerHTML = `Instagram: <a href="${footer.instagram_url}" target="_blank" rel="noopener">${footer.instagram_handle}</a>`;
    }
    document.getElementById('footer-ein').textContent = 'EIN: ' + content.donate.confidence.ein;
    document.getElementById('footer-copyright').textContent = footer.copyright;
    document.getElementById('footer-legal-links').innerHTML = footer.legal_links.map(l =>
      l.action ? `<a href="#" data-action="${l.action}">${l.label}</a>` : `<a href="${l.href}">${l.label}</a>`
    ).join('');
  });
</script>
<script src="cookie-consent.js?v=2"></script>
</body>
</html>
