<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate — West Sacramento Inclusive Sailing Foundation</title>
<meta name="description" content="Support West Sacramento Inclusive Sailing Foundation and help put more people at the helm.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/logo-stack-light.svg" alt="West Sacramento Inclusive Sailing Foundation" class="brand-logo">
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    <ul class="nav-links" id="navLinks"></ul>
  </div>
</nav>

<header class="hero hero-page" id="donate-hero">
  <div class="container">
    <div class="section-head" style="margin-bottom:0;">
      <span class="eyebrow">Why It Matters</span>
      <h2 id="donate-headline"></h2>
      <div id="donate-intro"></div>
      <div class="cta-row"><a class="btn btn-primary" id="donate-intro-cta" href="#"></a></div>
    </div>
  </div>
</header>

<section class="section-dark">
  <div class="container">
    <h2 id="donate-closing-headline"></h2>
    <div id="donate-closing-lines" style="font-family:var(--font-display); text-transform:uppercase; font-size:clamp(1.2rem,2.4vw,1.6rem); line-height:1.5;"></div>
    <p id="donate-closing-body" style="margin-top:0.8em;"></p>
    <div class="cta-row">
      <a class="btn btn-primary" id="donate-closing-cta-primary" href="#"></a>
      <a class="btn btn-outline" id="donate-closing-cta-secondary" href="#"></a>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="assets/logo-stack-light.svg" alt="" aria-hidden="true" class="footer-logo">
        <div id="footer-org-name" class="footer-org-name"></div>
        <div class="tagline" id="footer-tagline"></div>
        <div id="footer-address" class="footer-line"></div>
        <div id="footer-phone" class="footer-line"></div>
        <div id="footer-email" class="footer-line"></div>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <ul id="footer-nav-links"></ul>
      </nav>
    </div>
    <div class="footer-legal">
      <p id="footer-legal-statement"></p>
      <p class="ein-line" id="footer-ein"></p>
      <p class="footer-social" id="footer-instagram"></p>
    </div>
    <div class="footer-bottom">
      <div id="footer-copyright"></div>
      <div class="footer-legal-links" id="footer-legal-links"></div>
    </div>
  </div>
</footer>

<script src="script.js?v=20"></script>
<script src="cookie-consent.js?v=6"></script>
</body>
</html>
