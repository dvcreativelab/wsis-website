<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsor — West Sacramento Inclusive Sailing Foundation</title>
<meta name="description" content="Become a corporate sponsor of West Sacramento Inclusive Sailing Foundation and put your company behind inclusive sailing.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="assets/logo-stack-light.svg" alt="West Sacramento Inclusive Sailing Foundation" class="brand-logo">
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    <ul class="nav-links" id="navLinks"></ul>
  </div>
</nav>

<header class="hero hero-page" id="sponsor-hero">
  <div class="container">
    <div class="section-head" style="margin-bottom:0;">
      <h2 id="sponsor-corporate-headline"></h2>
      <p id="sponsor-corporate-intro"></p>
    </div>
  </div>
</header>

<section class="on-white">
  <div class="container">
    <div class="tier-grid" id="sponsor-corporate-tiers"></div>
    <div class="cta-row"><a class="btn btn-primary" id="sponsor-corporate-cta" href="#"></a></div>
    <p style="margin-top:24px; color:rgba(22,35,43,0.7);">
      <span id="sponsor-custom-note"></span>
      <a href="#" id="sponsor-custom-cta" style="color:var(--teal-text); text-decoration:underline; margin:0 4px;"></a>
      <span id="sponsor-custom-note-after"></span>
    </p>
  </div>
</section>

<section class="on-white" style="border-top:1px solid rgba(22,35,43,0.1);">
  <div class="container" style="text-align:center;">
    <h3 id="sponsor-sponsors-headline" style="text-transform:uppercase; font-family:var(--font-display);"></h3>
    <div class="sponsor-grid" id="sponsor-sponsors-grid"></div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="assets/logo-stack-light.svg" alt="" aria-hidden="true" class="footer-logo">
        <div id="footer-org-name" class="footer-org-name"></div>
        <div class="tagline" id="footer-tagline"></div>
        <div id="footer-address" class="footer-line"></div>
        <div id="footer-phone" class="footer-line"></div>
        <div id="footer-email" class="footer-line"></div>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <ul id="footer-nav-links"></ul>
      </nav>
    </div>
    <div class="footer-legal">
      <p id="footer-legal-statement"></p>
      <p class="ein-line" id="footer-ein"></p>
      <p class="footer-social" id="footer-instagram"></p>
    </div>
    <div class="footer-bottom">
      <div id="footer-copyright"></div>
      <div class="footer-legal-links" id="footer-legal-links"></div>
    </div>
  </div>
</footer>

<script src="script.js?v=6"></script>
<script src="cookie-consent.js?v=6"></script>
</body>
</html>
